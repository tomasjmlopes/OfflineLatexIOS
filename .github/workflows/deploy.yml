name: Deploy free offline LaTeX web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install engine dependencies
        run: npm install --no-audit --no-fund
      - name: Build browser compiler
        run: npm run build:engine
      - name: Fetch matched scientific TeX Live runtime
        run: bash scripts/prepare-runtime.sh
      - name: Check runtime and JavaScript
        run: |
          npm run test:syntax
          node --test tests/test_logic.mjs
          test -s runtime/bundles/bundles.json
          test -s runtime/wasm/busytex.wasm
          test -s compiler/siglum.bundle.js
      - name: Stage website
        run: |
          mkdir -p dist
          cp index.html styles.css manifest.webmanifest sw.js dist/
          cp -R src vendor icons compiler runtime dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish via GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
